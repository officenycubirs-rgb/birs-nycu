<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="空間導覽">
<meta name="theme-color" content="#0b3a8c">
<meta name="format-detection" content="telephone=no">
<title>生醫影像系空間導覽</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Layout: 觸控螢幕全螢幕介面。左側空間選單，中間等角視角場景，右側滑出空間資訊。 */
:root{
  --bg:#e8edf3; --panel:#ffffff; --ink:#10243e; --muted:#566a82; --line:#d3dce7;
  --accent:#0b3d91; --accent-ink:#ffffff; --accent-soft:#e3ebf9; --navy:#0a2a66; --sky:#8dbbe6;
  --stage-a:#f7fafd; --stage-b:#dbe5f0;
  --slab:#fdfeff; --slab-r:#c5d3e3; --slab-l:#adbed3; --slab-hi:#eaf2fb; --lock:#d9dfe7; --pillar:#8fa3bb;
  --halo:#ffffff; --pin:#e5392a;
  --c-teach:#7fb4ea; --c-lab:#6fcbb0; --c-research:#b8a8ec; --c-office:#f2c65f; --c-public:#ea9bbd; --c-support:#b3bdc9; --c-nd:#d5dbe3;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1522; --panel:#14233a; --ink:#e6edf7; --muted:#9db0c7; --line:#27395a;
  --accent:#7fb0ff; --accent-ink:#0a1830; --accent-soft:#1d3358;
  --stage-a:#182a45; --stage-b:#0f1c30;
  --slab:#22385a; --slab-r:#182a47; --slab-l:#12203a; --slab-hi:#2b4673; --lock:#1b2b46; --pillar:#4a6288;
  --halo:#0f1c30; --pin:#ff6a58;
  --c-teach:#4f86c4; --c-lab:#3fa68b; --c-research:#8171c9; --c-office:#c9993a; --c-public:#c46c92; --c-support:#6c7a8c; --c-nd:#2b3b57;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1522; --panel:#14233a; --ink:#e6edf7; --muted:#9db0c7; --line:#27395a;
  --accent:#7fb0ff; --accent-ink:#0a1830; --accent-soft:#1d3358;
  --stage-a:#182a45; --stage-b:#0f1c30;
  --slab:#22385a; --slab-r:#182a47; --slab-l:#12203a; --slab-hi:#2b4673; --lock:#1b2b46; --pillar:#4a6288;
  --halo:#0f1c30; --pin:#ff6a58;
  --c-teach:#4f86c4; --c-lab:#3fa68b; --c-research:#8171c9; --c-office:#c9993a; --c-public:#c46c92; --c-support:#6c7a8c; --c-nd:#2b3b57;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;height:calc(100dvh - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:clamp(300px,24vw,420px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0 16px}

/* header */
.top{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:14px 4px 12px;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:26px;font-weight:700;letter-spacing:.04em}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.12em}
.top .sp{flex:1}
.ver{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.home{min-height:52px;padding:0 22px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.home:active,.btn:active{transform:scale(.97)}


/* header：系徽／校徽＋BIRS 深藍到天藍的水彩漸層 */
.top{margin:12px 0 0;padding:10px 18px 10px 12px;border-radius:16px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(60% 140% at 92% -30%,rgba(141,187,230,.55),transparent 62%),radial-gradient(40% 120% at 45% 130%,rgba(141,187,230,.30),transparent 65%),linear-gradient(100deg,#0a2a66 0%,#10408c 55%,#2a68b4 100%);
  box-shadow:0 2px 10px rgba(10,42,102,.25)}
.logos{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:6px 18px 6px 12px;flex:none}
.logos img{display:block;width:auto}
.logos .lg-d{border-radius:10px;height:74px}
.logos .lg-e{height:60px}
.logos .lg-n{height:34px}
.logos i{width:1px;height:50px;background:#cfd8e6}
.top .brand b{font-size:24px;letter-spacing:.06em}
.top .brand span{font-size:11.5px;letter-spacing:.1em;color:#bcd6f2}
.top .ver{color:#bcd6f2}
.top .home{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.top .home:active{background:rgba(255,255,255,.3)}

.wm{position:absolute;right:3%;top:4%;width:min(34%,400px);aspect-ratio:1;object-fit:contain;opacity:.12;mix-blend-mode:multiply;pointer-events:none;z-index:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.12}}
:root[data-theme="dark"] .wm{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.12}

/* menu */
.menu{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.menu h2{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:16px 18px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;border-bottom:1px solid var(--line)}
.tab{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:500;display:inline-flex;align-items:center}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 8px 16px;min-height:0}
.grp{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;padding:14px 10px 8px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent);border-bottom:1px solid var(--line)}
.grp span{color:var(--muted);font-weight:500}
.item{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border-bottom:1px solid transparent}
.item .dot{flex:none;width:14px;height:14px;border-radius:4px;background:var(--cat);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cat) 55%,#000)}
.item b{flex:none;min-width:3.4em;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.item .nm{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.item em{flex:none;font-style:normal;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.item .rad{flex:none}
.item:active{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.item[aria-current="true"] em{background:var(--accent-ink);color:var(--accent)}
.empty{padding:28px 14px;color:var(--muted)}

/* stage */
#stage{position:relative;min-width:0;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(38% 30% at 92% 8%,rgba(120,175,228,.30),transparent 72%),radial-gradient(34% 28% at 4% 96%,rgba(120,175,228,.26),transparent 72%),radial-gradient(18% 14% at 70% 92%,rgba(120,175,228,.16),transparent 75%),radial-gradient(120% 90% at 50% 30%,var(--stage-a),var(--stage-b))}
#viewport{position:absolute;inset:0 0 140px 0;overflow:hidden;transition:right .38s cubic-bezier(.2,.8,.2,1)}
#app.info-open #viewport{right:min(480px,100%)}
#viewport svg{touch-action:none;position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1);transform-origin:50% 55%}
#viewport svg.hide{opacity:0;pointer-events:none}
#ov.hide{transform:scale(1.08)}
#fl.hide{transform:scale(.94)}
.k-teach{--cat:var(--c-teach)}.k-lab{--cat:var(--c-lab)}.k-research{--cat:var(--c-research)}
.k-nd{--cat:var(--c-nd)}.k-office{--cat:var(--c-office)}.k-public{--cat:var(--c-public)}.k-support{--cat:var(--c-support)}
.rm{cursor:pointer;transition:opacity .3s}
.rm .top{fill:var(--cat);stroke:color-mix(in srgb,var(--cat) 50%,#000);stroke-width:.9;stroke-linejoin:round}
.rm .rt{fill:color-mix(in srgb,var(--cat) 80%,#000);stroke:color-mix(in srgb,var(--cat) 50%,#000);stroke-width:.6}
.rm .lf{fill:color-mix(in srgb,var(--cat) 64%,#000);stroke:color-mix(in srgb,var(--cat) 50%,#000);stroke-width:.6}
.rm.sel .top{stroke:var(--ink);stroke-width:3}
.rm:active .top{filter:brightness(1.12)}
.dim1{opacity:.42}.dim2{opacity:.14}
.rm.nd{pointer-events:none;cursor:default}
#fl.probe .rm,#ov.probe .rm{pointer-events:auto}
.lbl.nd text{fill:var(--muted);font-weight:500}
.chip i.ndsw{background:var(--c-nd)}
.chip i.hdsw{background:#2f7bff;border-radius:50%}
.here{pointer-events:none}
.here .hd{fill:#2f7bff;stroke:#fff}
.here .hr{fill:#2f7bff;fill-opacity:.28;transform-box:fill-box;transform-origin:center}
.here .ht{fill:var(--accent);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:4;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.here .hr{animation:hp 1.8s ease-out infinite}}
@keyframes hp{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}
.slab .st{fill:var(--slab);stroke:var(--pillar);stroke-width:1.2}
.slab .sr{fill:var(--slab-r)}.slab .sl{fill:var(--slab-l)}
.lbl{pointer-events:none;transition:opacity .3s}
.lbl text{fill:var(--ink);font-weight:500;stroke:var(--halo);stroke-width:3.2;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.lbl text.id{font-weight:700}
#ov .rm{pointer-events:none}
#ov .rm .top{stroke-width:.7}
.ovfloor{cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.ovfloor.up{transform:translateY(-70px)}
.ovfloor.dim{opacity:.16}
.bc{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:1.4;stroke-linejoin:round}
.bw{fill:var(--accent);fill-opacity:.13;stroke:var(--accent);stroke-width:1;stroke-linejoin:round}
.bmu{stroke:var(--accent);stroke-opacity:.55;stroke-width:1}
.bridge{cursor:pointer}
.bridge:active .bc{fill-opacity:.4}
.brl{fill:var(--accent);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:4;stroke-linejoin:round;transition:opacity .4s}
.ovbridge{transition:opacity .4s}
.ovbridge.dim,.brl.dim{opacity:.16}
.ovfloor.up .st{stroke:var(--accent);stroke-width:3.5}
.ovfloor:active .st{fill:var(--slab-hi)}
.ovfloor.lock{cursor:default}
.ovfloor.lock .st{fill:var(--lock);stroke-dasharray:10 8}
.ovl{fill:var(--ink);font-weight:700;text-anchor:end;paint-order:stroke;stroke:var(--halo);stroke-width:5;stroke-linejoin:round}
.ovs{fill:var(--muted);font-weight:500;text-anchor:end;paint-order:stroke;stroke:var(--halo);stroke-width:4}
.bt{fill:var(--ink);font-weight:700;text-anchor:middle;letter-spacing:.06em}
.bs{fill:var(--muted);font-weight:500;text-anchor:middle}
.pil{stroke:var(--pillar);stroke-width:2;stroke-dasharray:8 8;fill:none;opacity:.8}
.ghost{fill:none;stroke:var(--pillar);stroke-width:2;stroke-dasharray:10 8;opacity:.7}
.pin{animation:bob 1.3s ease-in-out infinite}
.pinb{fill:var(--pin);stroke:#fff;stroke-width:2.5}
.pind{fill:#fff}
@keyframes bob{50%{transform:translateY(-7px)}}

.crumb{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:12px;z-index:5}
.crumb .btn{min-height:52px}
.btn{min-height:52px;padding:0 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500}
.crumb .path{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:52px;padding:0 18px;display:inline-flex;align-items:center;font-weight:700}
.crumb .path span{font-weight:500;color:var(--muted);margin:0 8px}
.crumb .btn{white-space:nowrap}.crumb{max-width:calc(100% - 90px)}.crumb .path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:52px}
@media (max-width:820px){.crumb .path{line-height:44px;padding:0 12px}.crumb .btn{padding:0 12px}}
.hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 22px;color:var(--muted);font-size:15px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.legend{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
.chip{min-height:48px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.chip i{width:14px;height:14px;border-radius:4px;background:var(--cat);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cat) 55%,#000)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{background:transparent;border-style:dashed;color:var(--muted);cursor:default;font-size:14px}
.legend .gap{flex:1}

.coline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;display:none}
.coline #col-w{stroke:var(--panel);stroke-width:7;stroke-linecap:round}
.coline #col-i{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.copin .pin{visibility:hidden}
.callout{position:absolute;z-index:6;width:min(340px,calc(100% - 24px));background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:14px 16px 14px;box-shadow:0 12px 30px rgba(10,30,60,.22)}
.callout::after{display:none;content:"";position:absolute;left:var(--ax,50%);bottom:-11px;width:18px;height:18px;margin-left:-9px;background:var(--panel);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.callout.below::after{bottom:auto;top:-11px;transform:rotate(225deg)}
.callout.toleft::after{bottom:auto;left:auto;right:-11px;top:var(--ay,50%);margin:-9px 0 0;transform:rotate(-45deg)}
.callout.toright::after{bottom:auto;right:auto;left:-11px;top:var(--ay,50%);margin:-9px 0 0;transform:rotate(135deg)}
.co-l{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.co-m{font-size:16px;font-weight:500;margin:-6px 0 10px}
.co-m+.co-n{margin-top:-6px}
.co-n{font-size:14px;color:var(--muted);margin:-6px 0 4px}
.co-t{font-size:20px;font-weight:700;margin:2px 0 12px;overflow-wrap:anywhere}
.callout .btn{width:100%;justify-content:center}

/* drawer */
.drawer{position:absolute;top:0;bottom:0;right:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:8;transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-14px 0 30px rgba(10,30,60,.12)}
.drawer.open{transform:none}
.dh{padding:18px 20px 16px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
.dh .x{position:absolute;right:14px;top:14px;min-height:52px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.dh .loc{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.1em;padding-right:100px}
.dh h2{font-size:28px;line-height:1.2;margin:6px 100px 12px 0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:500}
.tag i{width:12px;height:12px;border-radius:3px;background:var(--cat)}
.db{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-content:start}
.db section{grid-column:1/-1;padding:16px 0;border-bottom:1px solid var(--line);min-width:0}
.db section.half{grid-column:span 1}
.db h3{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.db p{font-size:18px;overflow-wrap:anywhere}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:16px;font-weight:500;margin-left:4px;color:var(--muted)}
.tbd{color:var(--muted);font-size:16px;font-style:normal}
.eq{display:flex;flex-wrap:wrap;gap:8px;list-style:none}
.eq li{background:var(--accent-soft);border-radius:8px;padding:6px 12px;font-size:16px}
.book{grid-column:1/-1;margin-top:18px;border:2px solid var(--accent);border-radius:14px;padding:16px 18px;background:var(--accent-soft)}
.book b{display:block;font-size:18px;margin-bottom:2px}
.book p{font-size:17px;margin-bottom:12px}
.book .btn{width:100%;justify-content:center}

.top .brand b em{font-style:normal;margin-left:1em}
.top .lang{min-width:60px;justify-content:center;font-weight:700;letter-spacing:.04em}
.lang-en .top .brand span{display:none}.lang-en .top .brand b{letter-spacing:.01em}
.zoomc{position:absolute;right:16px;top:16px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomc button{width:48px;height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:22px;font-weight:700;text-align:center;line-height:1;box-shadow:0 2px 8px rgba(10,30,60,.12)}
.zoomc button:active{background:var(--accent-soft)}
.menu h2{display:flex;justify-content:space-between;align-items:center}
.menu h2::after{content:"";display:none}

/* ===== 手機、平板直式：上方標題，中間地圖，下方可收合的空間選單；空間資訊改為底部面板 ===== */
@media (max-width:820px),(max-aspect-ratio:1/1){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px 0}
  .top{order:1;margin-top:max(8px,env(safe-area-inset-top,0px));padding:8px 10px;gap:10px}
  #stage{order:2}
  .menu{order:3;max-height:40dvh;margin-bottom:8px}
  .logos{padding:4px 10px 4px 8px;gap:8px}
  .logos .lg-e{height:40px}.logos .lg-n{height:24px}
  .top .brand b{font-size:17px;letter-spacing:.03em;line-height:1.25}
  .top .brand span,.top .ver{display:none}
  .top .home{min-height:44px;padding:0 14px;font-size:15px}
  .menu h2{cursor:pointer;min-height:44px;padding:4px 16px 0}
  .tabs{padding-top:4px}
  .menu h2::after{display:inline-block;content:"▾";font-size:16px;transition:transform .2s}
  .menu.collapsed h2::after{transform:rotate(180deg)}
  .menu.collapsed #list{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
  .tab{flex:none;white-space:nowrap;min-height:44px}
  .item{min-height:52px}
  .crumb{left:10px;top:10px;gap:8px}
  .crumb .btn,.crumb .path{min-height:44px;padding:0 14px;font-size:15px}
  .zoomc{right:10px;top:10px}.zoomc button{width:44px;height:44px}
  .hint{display:none}
  #viewport{bottom:58px}
  .legend{left:8px;right:8px;bottom:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .legend .gap{display:none}
  .chip{flex:none;min-height:44px;font-size:14px;white-space:nowrap}
  .wm{width:min(52%,300px);right:2%;top:2%}
  .callout{width:min(300px,calc(100% - 16px));padding:12px 14px}
  .co-t{font-size:18px}
  .drawer{position:fixed;z-index:20;top:auto;left:0;right:0;bottom:0;width:100%;height:min(74dvh,680px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  .drawer.open{transform:none}
  .dh{padding:14px 16px 12px}
  .dh h2{font-size:22px}
  #app.info-open #viewport{right:0}
}
@media (max-width:560px){
  .logos .lg-n{display:none}
  .top .brand b{font-size:13px;letter-spacing:0}
  .top .brand b em{margin-left:0;display:block;font-size:12px;font-weight:500;letter-spacing:.22em;color:#bcd6f2}
  .top .home{padding:0 9px;font-size:13px;white-space:nowrap}
  .db{grid-template-columns:1fr;padding:4px 16px 20px}
  .db section.half{grid-column:1/-1}
}
/* ===== 平板橫向：資訊面板與選單縮窄，留更多空間給地圖 ===== */
@media (max-width:1280px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:clamp(250px,22vw,300px) minmax(0,1fr)}
  .drawer{width:min(400px,42%)}
  #app.info-open #viewport{right:min(400px,42%)}
}
/* ===== 手機橫向：維持左右兩欄，但縮小標題列與選單 ===== */
@media (max-height:560px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:clamp(210px,28vw,290px) minmax(0,1fr);gap:0 10px}
  .top{margin-top:max(6px,env(safe-area-inset-top,0px));padding:4px 10px 4px 8px;gap:12px}
  .logos{padding:3px 10px 3px 6px}.logos .lg-e{height:32px}.logos .lg-n{height:20px}
  .top .brand b{font-size:15px}.top .brand span,.top .ver{display:none}
  .top .home{min-height:40px;padding:0 14px;font-size:14px}
  .menu h2{padding:8px 14px 4px}.tab{min-height:40px}.item{min-height:48px}
  .crumb{top:8px;left:8px}.crumb .btn,.crumb .path{min-height:44px}
  .zoomc{right:8px;top:8px}.zoomc button{width:44px;height:44px}
  .chip{min-height:40px;flex:none;white-space:nowrap}.legend{bottom:6px;left:8px;right:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.legend .gap{display:none}
  .hint{display:none}
  #viewport{bottom:58px}
  .wm{width:min(30%,220px)}
  .drawer{width:min(400px,62%)}
  .db{grid-template-columns:1fr}.db section.half{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function TL(s){
  if(lang!=='en'||s==null)return s;
  if(EN[s]!=null)return EN[s];
  return String(s).replace(/生醫工程館/g,EN['生醫工程館']).replace(/實驗大樓/g,EN['實驗大樓']);
}
function N(s){ /* 空間名稱 */
  if(lang!=='en'||!s)return s;
  if(EN[s]!=null)return EN[s];
  var m=/^(.+?)老師(辦公室|研究室|研究生室|實驗室)$/.exec(s);
  if(m)return 'Prof. '+(TEACH_EN[m[1]]||m[1])+'’s '+TKIND[m[2]];
  return s;
}
function rn(r){return (lang==='en'&&r.en)?r.en:N(r.name);}

function fld(v){return (v&&typeof v==='object'&&!Array.isArray(v))?(v[lang]||v.zh||''):v;}
function tx(v){return (v&&typeof v==='object'&&!Array.isArray(v))?(v[lang]||v.zh||''):v;} /* 資料欄位可寫成 {zh:'…',en:'…'} */
function wrapLabel(name,cpl,maxL,pxw){
  var lines=[],i;
  if(lang==='en'){
    var lim=Math.max(9,Math.floor((pxw||cpl*15)/8)),cur='';maxL+=1;
    name.split(/\s+/).forEach(function(w){
      while(w.length>lim+3){if(cur){lines.push(cur);cur='';}lines.push(w.slice(0,lim));w=w.slice(lim);}
      if(!cur)cur=w;else if((cur+' '+w).length<=lim)cur+=' '+w;else{lines.push(cur);cur=w;}
    });
    if(cur)lines.push(cur);
    if(lines.length>maxL){lines=lines.slice(0,maxL);lines[maxL-1]=lines[maxL-1].replace(/.?$/,'…');}
    return lines;
  }
  for(i=0;i<name.length&&lines.length<maxL;i+=cpl)lines.push(name.slice(i,i+cpl));
  if(name.length>cpl*maxL)lines[maxL-1]=lines[maxL-1].slice(0,-1)+'…';
  return lines;
}

/* 天橋：有頂的玻璃廊道（桌面＋兩側玻璃牆＋屋頂），pz 不為空時在下方加橋墩 */
function bridgeSVG(x,y,w,d,z,o,cls,pz){
  var H1=22,dk=faces(x,y,w,d,z-T,T,o),rf=faces(x-2,y-3,w+4,d+6,z+H1,4,o),g='<g class="'+(cls||'')+'">';

  g+=poly('bw',[Q(x+w,y,z+H1,o),Q(x+w,y+d,z+H1,o),Q(x+w,y+d,z,o),Q(x+w,y,z,o)]);
  var n=Math.max(3,Math.round(w/16));

function byDepth(a,c){return (a.x+a.w/2+a.y+a.d/2)-(c.x+c.w/2+c.y+c.d/2);}

function depthSort(arr){
  var n=arr.length,E=.5,seen=new Array(n),out=[];
  function behind(A,B){return (A.x+A.w<=B.x+E&&A.y<B.y+B.d-E&&A.y+A.d>B.y+E)||(A.y+A.d<=B.y+E&&A.x<B.x+B.w-E&&A.x+A.w>B.x+E);}
  function visit(i){if(seen[i])return;seen[i]=1;for(var j=0;j<n;j++)if(j!==i&&!seen[j]&&behind(arr[j],arr[i]))visit(j);out.push(arr[i]);}
  var idx=arr.map(function(_,i){return i;}).sort(function(a,c){return byDepth(arr[a],arr[c]);});
  idx.forEach(visit);
  return out;
}

  h+='<section class="half"><h3>'+TL('管理者')+'</h3>'+(I.manager?'<p>'+esc(tx(I.manager))+'</p>':tbd)+'</section>';
  h+='<section class="half"><h3>'+TL('可容納人數')+'</h3>'+(I.capacity!==''?'<div class="big">'+esc(I.capacity)+'<small>'+TL('人')+'</small></div>':tbd)+'</section>';
  h+='<section><h3>'+TL('內含設備')+'</h3>'+eq+'</section>';
  h+='<section><h3>'+TL('功用')+'</h3>'+(I.purpose?'<p>'+esc(tx(I.purpose))+'</p>':tbd)+'</section>';
  if(r.book){
    h+='<div class="book"><b>'+TL('可借用空間')+'</b><p>'+(r.note&&!/目前尚無/.test(r.note)?esc(noteT(r.note)):TL('如需借用空間，請洽系辦公室。'))+'</p>'+(r.id!=='454'?'<button type="button" class="btn" data-act="admin">'+TL('在地圖上查看系辦位置（生醫工程館 4F）')+'</button>':'')+'</div>';
  }

  d.innerHTML=h;

}

/* ============ 位置提示卡 ============ */
var coKey='',coHidden=false,coSelPrev=null;
function coOff(){$('#coline').style.display='none';['#fl','#ov'].forEach(function(q){$(q).classList.remove('copin');});}
var coBest=null;
function placeCallout(force){
  var c=$('#callout'),r=st.sel&&ROOMS[st.sel];
  var ln=$('#coline');
  var off=coOff;
  if(!r||st.info){c.hidden=true;coKey='';off();return;}
  if(coHidden){c.hidden=true;off();return;}
  var sv=st.mode==='floor'?'#fl':'#ov';
  var pin=document.querySelector(sv+' .pin');
  if(!pin){c.hidden=true;off();return;}
  if(coKey!==r.id){
    c.innerHTML='<div class="co-l">'+TL('位置')+(lang==='en'?': ':'　')+esc(locText(r))+'</div><div class="co-t">'+esc(r.id!==r.name?r.id+' ':'')+esc(rn(r))+'</div>'+(r.info&&r.info.manager?'<div class="co-m">'+TL('管理者')+(lang==='en'?': ':'：')+esc(fld(r.info.manager))+'</div>':'')+(r.personal&&r.note&&!/目前尚無/.test(r.note)?'<div class="co-n">'+esc(noteT(r.note))+'</div>':'')+(r.personal?'':'<button type="button" class="btn" data-act="open">'+TL('查看空間資訊 ›')+'</button>');
    coKey=r.id;
  }
  c.hidden=false;
  var sr=$('#stage').getBoundingClientRect(),SW=sr.width,SHt=sr.height,w=c.offsetWidth,h=c.offsetHeight;
  var els=document.querySelectorAll(sv+' .rm[data-id="'+String(r.id).replace(/"/g,'\\"')+'"]');
  var rr=els.length?els[els.length-1].getBoundingClientRect():pin.getBoundingClientRect(),pr=pin.getBoundingClientRect();
  /* T：選取的空間（含標示針）在地圖區中的範圍，簡介方框不可蓋到 */
  var T={l:Math.min(rr.left,pr.left)-sr.left-8,t:Math.min(rr.top,pr.top)-sr.top-8,r:Math.max(rr.right,pr.right)-sr.left+8,b:Math.max(rr.bottom,pr.bottom)-sr.top+8};
  var RS=[];['#crumb','.zoomc','.legend','.hint'].forEach(function(q){var e=$(q);if(!e||e.offsetParent===null)return;if(q==='.hint'&&!e.textContent)return;var b=e.getBoundingClientRect();if(b.width&&b.height)RS.push({l:b.left-sr.left-6,t:b.top-sr.top-6,r:b.right-sr.left+6,b:b.bottom-sr.top+6});});
  function hit(a,b){return a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;}
  /* 位置一旦決定就固定：同一個空間、同一個畫面內不再移動，除非被選空間被蓋住 */
  var sig=st.mode+'|'+st.fk+'|'+st.sel,best=null;
  if(coBest&&coBest.sig===sig&&!force){
    var b0={l:coBest.x,t:coBest.y,r:coBest.x+w,b:coBest.y+h};
    if(!hit(b0,T)&&b0.l>=0&&b0.r<=SW&&b0.t>=0&&b0.b<=SHt)best=coBest;
  }
  if(!best){
  var cx=(T.l+T.r)/2,cy=(T.t+T.b)/2,cand=[];
  [14,40,80,140,220,320].forEach(function(g){
    for(var k=-4;k<=4;k++){
      [[cx-w/2+k*w*.5,T.t-g-h],[cx-w/2+k*w*.5,T.b+g],[T.l-g-w,cy-h/2+k*h*.5],[T.r+g,cy-h/2+k*h*.5]].forEach(function(p){
        var x=Math.max(8,Math.min(p[0],SW-w-8)),y=Math.max(8,Math.min(p[1],SHt-h-8)),b={l:x,t:y,r:x+w,b:y+h};
        if(hit(b,T))return;
        for(var i=0;i<RS.length;i++)if(hit(b,RS[i]))return;
        var dx=Math.max(T.l-b.r,b.l-T.r,0),dy=Math.max(T.t-b.b,b.t-T.b,0);
        cand.push({x:x,y:y,d:Math.hypot(dx,dy)});
      });
    }
  });
  cand.sort(function(a,b){return a.d-b.d;});
  function cover(x,y){
    var n=0;
    for(var i=0;i<5;i++)for(var j=0;j<4;j++){
      var els2=document.elementsFromPoint(sr.left+x+6+(w-12)*i/4,sr.top+y+6+(h-12)*j/3);
      for(var q=0;q<els2.length;q++){var e=els2[q];if(e.closest&&(e.closest('#fl .rm')||e.closest('#ov .ovfloor')||e.closest('.bridge'))){n++;break;}}
    }
    return n;
  }
  var bs=1e9,svgEl=$(sv);
  svgEl.classList.add('probe'); /* 暫時讓灰色（非本系）空間也能被偵測，避免簡介蓋住它們 */
  for(var i=0;i<cand.length&&i<70;i++){
    var cv=cover(cand[i].x,cand[i].y),sc=cv*1000+cand[i].d;
    if(sc<bs){bs=sc;best=cand[i];}
    if(cv===0)break;
  }
  svgEl.classList.remove('probe');
  if(!best){ /* 找不到合適位置時，放在地圖區右下角 */
    best={x:Math.max(8,SW-w-8),y:Math.max(8,SHt-h-8)};
  }
  coBest={x:best.x,y:best.y,sig:sig};
  }
  var bx={l:best.x,t:best.y,r:best.x+w,b:best.y+h},side;
  if(bx.b<=T.t)side='up';else if(bx.t>=T.b)side='down';else if(bx.r<=T.l)side='left';else side='right';
  c.classList.remove('below','toleft','toright');
  if(side==='down')c.classList.add('below');else if(side==='left')c.classList.add('toleft');else if(side==='right')c.classList.add('toright');
  var tcx=rr.left+rr.width/2-sr.left,tcy=rr.top+rr.height/2-sr.top;
  c.style.left=best.x+'px';c.style.top=best.y+'px';
  c.style.setProperty('--ax',Math.max(22,Math.min(w-22,tcx-best.x))+'px');
  c.style.setProperty('--ay',Math.max(22,Math.min(h-22,tcy-best.y))+'px');
  /* 引線：從簡介方框連到標示針尖；圖釘複製一份畫在引線上方，避免被線擋住 */
  var mo=pin.parentNode.getScreenCTM(),tx=mo.e-sr.left,ty=mo.f-sr.top;
  var ex=Math.max(best.x+14,Math.min(best.x+w-14,tx)),ey=Math.max(best.y,Math.min(best.y+h,ty));
  ['#col-w','#col-i'].forEach(function(q){var e=$(q);e.setAttribute('x1',ex.toFixed(1));e.setAttribute('y1',ey.toFixed(1));e.setAttribute('x2',tx.toFixed(1));e.setAttribute('y2',ty.toFixed(1));});
  var gp=$('#col-p');gp.setAttribute('transform','matrix('+[mo.a,mo.b,mo.c,mo.d,tx,ty].map(function(v){return v.toFixed(4);}).join(',')+')');
  gp.innerHTML=pin.outerHTML;
  $(sv).classList.add('copin');
  ln.style.display='block';
}
var coRq=0;function coRaf(){if(coRq)return;coRq=requestAnimationFrame(function(){coRq=0;placeCallout();});}
var coTimers=[];
/* delay>0：畫面正在切換（樓層、資訊面板），等動畫結束再顯示，避免方框跳來跳去 */
function scheduleCallout(delay){
  coTimers.forEach(clearTimeout);coTimers=[];
  if(delay){
    $('#callout').hidden=true;coOff();
    coTimers.push(setTimeout(function(){coBest=null;placeCallout(true);},delay));
  }else placeCallout();
}


/* ============ 縮放與拖曳（手機、平板雙指縮放；電腦滾輪、按鈕） ============ */
var PZ={};
function applyPZ(svg){
  var z=PZ[svg.id];if(!z)return;
  var w=z.vb[2]/z.k,h=z.vb[3]/z.k,m=.15;
  if(z.k<=1.02){z.cx=z.vb[0]+z.vb[2]/2;z.cy=z.vb[1]+z.vb[3]/2;}
  else{
    z.cx=Math.max(z.vb[0]+w/2-m*z.vb[2],Math.min(z.vb[0]+z.vb[2]-w/2+m*z.vb[2],z.cx));
    z.cy=Math.max(z.vb[1]+h/2-m*z.vb[3],Math.min(z.vb[1]+z.vb[3]-h/2+m*z.vb[3],z.cy));
  }
  svg.setAttribute('viewBox',(z.cx-w/2).toFixed(1)+' '+(z.cy-h/2).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
}
function setBase(svg,vb,key){
  var z=PZ[svg.id];
  if(!z||z.key!==key||Math.abs(z.vb[2]-vb[2])>.5||Math.abs(z.vb[3]-vb[3])>.5||Math.abs(z.vb[0]-vb[0])>.5)
    PZ[svg.id]={vb:vb,key:key,k:1,cx:vb[0]+vb[2]/2,cy:vb[1]+vb[3]/2};
  applyPZ(svg);
}
function curSvg(){return st.mode==='floor'?$('#fl'):$('#ov');}
function zoomAt(svg,px,py,nk){
  var z=PZ[svg.id];if(!z)return;
  nk=Math.max(1,Math.min(5,nk));
  var r=svg.getBoundingClientRect();
  var w=z.vb[2]/z.k,h=z.vb[3]/z.k,sc=Math.min(r.width/w,r.height/h),ox=(r.width-w*sc)/2,oy=(r.height-h*sc)/2;
  var ux=z.cx-w/2+(px-r.left-ox)/sc,uy=z.cy-h/2+(py-r.top-oy)/sc;
  z.k=nk;
  var w2=z.vb[2]/nk,h2=z.vb[3]/nk,sc2=Math.min(r.width/w2,r.height/h2),ox2=(r.width-w2*sc2)/2,oy2=(r.height-h2*sc2)/2;
  z.cx=ux+w2/2-(px-r.left-ox2)/sc2;z.cy=uy+h2/2-(py-r.top-oy2)/sc2;
  applyPZ(svg);coRaf();
}
(function(){
  var vp=$('#viewport'),ptrs={},moved=false,startPt=null,pinch=null;
  function cnt(){return Object.keys(ptrs).length;}
  vp.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(cnt()===1){moved=false;startPt={x:e.clientX,y:e.clientY};}
    if(cnt()===2){var a=Object.keys(ptrs).map(function(k){return ptrs[k];});pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};moved=true;}
  });
  window.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!p)return;
    var svg=curSvg(),z=PZ[svg.id];if(!z)return;
    if(cnt()===1){
      var dx=e.clientX-p.x,dy=e.clientY-p.y;
      if(!moved&&Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)>8)moved=true;
      p.x=e.clientX;p.y=e.clientY;
      if(moved&&z.k>1.02){
        var r=svg.getBoundingClientRect(),w=z.vb[2]/z.k,h=z.vb[3]/z.k,sc=Math.min(r.width/w,r.height/h);
        z.cx-=dx/sc;z.cy-=dy/sc;applyPZ(svg);coRaf();
      }
    }else if(cnt()===2&&pinch){
      var o=Object.keys(ptrs).filter(function(k){return +k!==e.pointerId;})[0],q=ptrs[o];
      var oldMx=(p.x+q.x)/2,oldMy=(p.y+q.y)/2;
      p.x=e.clientX;p.y=e.clientY;
      var d=Math.hypot(p.x-q.x,p.y-q.y),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
      if(pinch.d>0){zoomAt(svg,mx,my,z.k*d/pinch.d);}
      var z2=PZ[svg.id],r=svg.getBoundingClientRect(),w=z2.vb[2]/z2.k,h=z2.vb[3]/z2.k,sc=Math.min(r.width/w,r.height/h);
      if(z2.k>1.02){z2.cx-=(mx-oldMx)/sc;z2.cy-=(my-oldMy)/sc;applyPZ(svg);}
      pinch.d=d;
    }
  });
  function up(e){delete ptrs[e.pointerId];if(cnt()<2)pinch=null;}
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  vp.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  vp.addEventListener('wheel',function(e){e.preventDefault();var svg=curSvg(),z=PZ[svg.id];if(z)zoomAt(svg,e.clientX,e.clientY,z.k*Math.exp(-e.deltaY*0.0016));},{passive:false});
  document.querySelector('.zoomc').addEventListener('click',function(e){
    var b=e.target.closest('[data-zoom]');if(!b)return;
    var svg=curSvg(),z=PZ[svg.id];if(!z)return;
    var r=vp.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,k=b.dataset.zoom;
    if(k==='reset'){z.k=1;applyPZ(svg);coRaf();}
    else zoomAt(svg,cx,cy,z.k*(k==='in'?1.5:1/1.5));
  });
})();

/* ============ 渲染與動作 ============ */
var prevInfo=false,prevMode='';
function setLang(l){
  lang=l;try{localStorage.setItem('sg-lang',l);}catch(e){}
  applyStatic();coKey='';coBest=null;
  renderTabs();renderList();renderLegend();buildOverview();render();
}
function render(){
  if(coSelPrev!==st.sel){coHidden=false;coSelPrev=st.sel;}
  $('#app').classList.toggle('info-open',st.info&&!!st.sel);
  $('#ov').classList.toggle('hide',st.mode!=='overview');
  $('#fl').classList.toggle('hide',st.mode!=='floor');
  ovUpdate();
  if(st.mode==='floor')buildFloor();
  renderTabs();markList();
  document.querySelectorAll('.chip[data-cat]').forEach(function(c){c.setAttribute('aria-pressed',String(st.cat===c.dataset.cat));});
  renderTop();renderInfo();
  var infoNow=st.info&&!!st.sel;
  if(infoNow!==prevInfo){
    prevInfo=infoNow;
    setTimeout(function(){if(st.mode==='floor')buildFloor();},420);
  }
  var flow=st.mode+'|'+st.fk+'|'+(st.info&&!!st.sel);
  var delay=(flow!==coFlow)?560:0;coFlow=flow;
  scheduleCallout(delay);
}
var coFlow='';
function scrollToSel(){var cur=markList();if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',behavior:'smooth'});}
function pickFloor(fk){st.mode='floor';st.fk=fk;st.sel=null;st.info=false;render();}
function pickRoom(id,keepInfo){
  var r=ROOMS[id];if(!r)return;
  st.sel=id;st.fk=r.fk;if(!keepInfo||r.personal)st.info=false;
  if(st.listF!=='all'&&st.listF!==r.fk){st.listF='all';renderList();}
  if(st.cat&&st.cat!==r.cat){st.cat=null;renderLegend();renderList();}
  render();scrollToSel();
}
function openInfo(){if(!st.sel||ROOMS[st.sel].personal)return;st.info=true;st.mode='floor';st.fk=ROOMS[st.sel].fk;render();}
function back(){
  if(st.info){st.info=false;}
  else if(st.mode==='floor'){st.mode='overview';if(!st.sel)st.fk=null;}
  else{st.sel=null;st.fk=null;}
  render();
}
function home(){st.mode='overview';st.fk=null;st.sel=null;st.info=false;st.cat=null;st.listF='all';renderLegend();renderList();render();
  var l=$('#list');if(l)l.scrollTop=0;}


/* 直式小螢幕：空間選單可收合；選了空間後自動收起，讓出地圖 */
var STACK=window.matchMedia('(max-width:820px),(max-aspect-ratio:1/1)');
(function(){var m=$('.menu');if(!m)return;
  if(STACK.matches&&window.innerWidth<700)m.classList.add('collapsed');
  m.querySelector('h2').addEventListener('click',function(){if(STACK.matches)m.classList.toggle('collapsed');});
})();
function collapseMenu(){if(STACK.matches&&window.innerWidth<700)$('.menu').classList.add('collapsed');}
function expandMenu(){$('.menu').classList.remove('collapsed');}

document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;
  /* 空間資訊面板開啟時，點地圖空白處也可收起 */
  if(st.info&&t.closest('#viewport')&&!t.closest('#fl .rm,#fl .bridge,#ov .ovfloor')){st.info=false;render();return;}
  /* 簡介方框：點地圖空白處收起；收起後點空間會重新顯示簡介，再點一下進入空間資訊 */
  if(t.closest('#stage')&&!t.closest('#callout')&&!t.closest('#drawer')&&st.sel&&!st.info){
    var rm0=t.closest('#fl .rm');
    if(rm0&&rm0.dataset.id===st.sel&&coHidden){coHidden=false;placeCallout();return;}
    if(!rm0&&!coHidden){coHidden=true;placeCallout();}
  }
  var a=t.closest('[data-act]');
  if(a){
    var k=a.dataset.act;
    if(k==='close'){st.info=false;render();}
    else if(k==='open')openInfo();
    else if(k==='back')back();
    else if(k==='home')home();
    else if(k==='lang')setLang(lang==='en'?'zh':'en');
    else if(k==='admin'){st.info=false;pickRoom('454');}
    return;
  }
  var tab=t.closest('[data-tab]');
  if(tab){
    var v=tab.dataset.tab;st.listF=v;
    if(v==='all'){st.mode='overview';st.fk=null;st.sel=null;st.info=false;}
    else{st.mode='floor';st.fk=v;st.sel=null;st.info=false;}
    renderList();render();$('#list').scrollTop=0;return;
  }
  var chip=t.closest('[data-cat]');
  if(chip){st.cat=(st.cat===chip.dataset.cat)?null:chip.dataset.cat;renderList();render();return;}
  var it=t.closest('.item');
  if(it){pickRoom(it.dataset.id);collapseMenu();return;}
  var brg=t.closest('#fl .bridge');
  if(brg){st.listF=brg.dataset.to;renderList();pickFloor(brg.dataset.to);$('#list').scrollTop=0;return;}
  var rm=t.closest('#fl .rm');
  if(rm){
    var id=rm.dataset.id;
    if(st.sel===id){if(!st.info)openInfo();}
    else pickRoom(id,st.info);
    return;
  }
  var of=t.closest('#ov .ovfloor');
  if(of&&!of.classList.contains('lock')){pickFloor(of.dataset.f);}
});

/* 閒置 2 分鐘自動回到整棟總覽 */
var idle=null;
function arm(){clearTimeout(idle);idle=setTimeout(function(){if(lang!=='zh')setLang('zh');if(st.mode!=='overview'||st.sel||st.cat||st.listF!=='all')home();},120000);}
['pointerdown','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,arm,{passive:true});});
arm();

var rz=null;
window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){applyStatic();buildOverview();render();},160);});

applyStatic();renderTabs();renderList();renderLegend();buildOverview();render();
setTimeout(function(){buildOverview();render();},350);
})();
